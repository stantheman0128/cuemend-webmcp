name: Render demo video

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out the frozen source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Confirm media tools
        shell: powershell
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
          }
          $ffmpegVersion = @(& ffmpeg -version)
          $ffprobeVersion = @(& ffprobe -version)
          Write-Output $ffmpegVersion[0]
          Write-Output $ffprobeVersion[0]

      - name: Render the narrated demo package
        shell: powershell
        run: npm run demo:video

      - name: Verify the package metadata
        shell: powershell
        run: |
          $metadata = Get-Content -LiteralPath artifacts\demo\demo-video-metadata.json -Raw | ConvertFrom-Json
          if (-not $metadata.ok) { throw 'Video metadata does not report success.' }
          if ($metadata.durationSeconds -ge 180) { throw 'Video is not under three minutes.' }
          if ($metadata.video.width -ne 1280 -or $metadata.video.height -ne 720) { throw 'Unexpected video resolution.' }
          if (-not $metadata.audio) { throw 'Audio stream metadata is missing.' }

      - name: Upload the verified demo package
        uses: actions/upload-artifact@v4
        with:
          name: cuemend-demo-video
          path: |
            artifacts/demo/cuemend-webmcp-demo.mp4
            artifacts/demo/cuemend-demo-captions.srt
            artifacts/demo/cuemend-video-thumbnail.jpg
            artifacts/demo/demo-video-metadata.json
            artifacts/demo/scene-timing.json
          if-no-files-found: error
          retention-days: 3
